[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "lorentz-test"
version = "0.3.0"
description = "Local production and service test utility for Lorentz controllers and modules"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116,<1.0",
  "pydantic>=2.10,<3.0",
  "pyserial>=3.5,<4.0",
  "uvicorn[standard]>=0.35,<1.0",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1.0",
  "pytest>=8.3,<10.0",
  "ruff>=0.9,<1.0",
]

[project.scripts]
lorentz-test = "lorentz_test.main:run"

[tool.hatch.build.targets.wheel]
packages = ["src/lorentz_test"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

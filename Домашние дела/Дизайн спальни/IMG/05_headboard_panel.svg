<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700"><rect width="1200" height="700" fill="#f5f3ee"/><rect x="28" y="28" width="1144" height="644" rx="28" fill="#fbfaf7" stroke="#ded8cd"/><text x="700" y="105" font-family="DejaVu Sans, Arial" font-size="42" font-weight="700" fill="#33312d">Стена изголовья</text><text x="700" y="150" font-family="DejaVu Sans, Arial" font-size="23" fill="#6c665d">Текстильное или рельефное панно</text><g transform="translate(85,130)"><rect x="30" y="30" width="510" height="350" rx="8" fill="#eee9df" stroke="#cfc6b7" stroke-width="4"/><g fill="none" stroke="#d0c7b8" stroke-width="8" opacity=".9"><path d="M80 330 C160 120 260 130 340 65"/><path d="M220 360 C300 185 390 180 495 75"/><path d="M70 80 V350 M110 60 V350 M150 55 V350 M190 55 V350 M230 55 V350 M270 55 V350 M310 55 V350 M350 55 V350 M390 55 V350 M430 55 V350 M470 55 V350"/></g></g><text x="700" y="230" font-family="DejaVu Sans" font-size="24" fill="#45413b">• один крупный объект</text><text x="700" y="275" font-family="DejaVu Sans" font-size="24" fill="#45413b">• 150–175 × 80–105 см</text><text x="700" y="320" font-family="DejaVu Sans" font-size="24" fill="#45413b">• текстиль / акустический войлок</text><text x="700" y="365" font-family="DejaVu Sans" font-size="24" fill="#45413b">• без стекла и тяжёлой рамы</text><text x="700" y="625" font-family="DejaVu Sans, Arial" font-size="18" fill="#968b7b">Схематический референс · точную модель сверять по ссылке</text></svg>